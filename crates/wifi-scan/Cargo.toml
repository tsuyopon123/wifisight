[package]
name = "wifi-scan"
description = "Thin per-OS Wi-Fi scanners (CoreWLAN / WLAN API / nl80211) producing raw BSS + IEs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wifi-core.workspace = true
serde.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSSet", "NSData", "NSError", "NSEnumerator"] }
objc2-core-wlan = { version = "0.3", features = ["CWWiFiClient", "CWInterface", "CWNetwork", "CWChannel", "CoreWLANTypes"] }
objc2-core-location = { version = "0.3", features = ["CLLocationManager"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi"] }
