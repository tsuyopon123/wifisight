[workspace]
resolver = "2"
members = ["crates/wifi-core", "crates/wifi-scan", "crates/wifi-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tsuyopon123/wifisight"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wifi-core = { path = "crates/wifi-core" }
wifi-scan = { path = "crates/wifi-scan" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
