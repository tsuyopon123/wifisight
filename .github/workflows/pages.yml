name: pages

# Publishes site/ (the project website) to GitHub Pages; the custom domain is set in Settings › Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", "Cargo.lock", "about.hbs", "about.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # regenerate from Cargo.lock so the site's notices never go stale
      - run: cargo about generate about.hbs -o site/THIRD_PARTY_LICENSES.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
