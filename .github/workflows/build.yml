name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unit tests + clippy + CLI on all three OSes (this is what type-checks the
  # macOS CoreWLAN and Windows WLAN API backends).
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm = aarch64 CLI for the Raspberry Pi probe (docs/probe.md)
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test core + scanner + cli
        run: cargo test -p wifi-core -p wifi-scan -p wifi-cli
      - name: Clippy (core / scanner / cli)
        run: cargo clippy -p wifi-core -p wifi-scan -p wifi-cli
      - name: Build CLI
        run: cargo build -p wifi-cli --release
      - uses: actions/upload-artifact@v7
        with:
          name: wifisight-cli-${{ matrix.os }}
          path: |
            target/release/wifisight-cli
            target/release/wifisight-cli.exe

  # GUI bundles: .dmg/.app (macOS), .msi/.exe (Windows), .deb/.AppImage (Linux)
  bundle:
    needs: test
    # creates the draft release on a v* tag
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: node src/heatmap.check.ts
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # On a v* tag, create a draft release with the bundles attached
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('WiFiSight {0}', github.ref_name) || '' }}
          releaseDraft: true
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.rpm

  # On a v* tag, attach the CLI binaries to the draft release created by the
  # bundle job.
  release-cli:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wifisight-cli-*
      - name: Package
        run: |
          mkdir out
          for pair in ubuntu-22.04:linux-x86_64 ubuntu-24.04-arm:linux-aarch64 macos-latest:macos-aarch64; do
            src=${pair%%:*} dst=wifisight-cli-${GITHUB_REF_NAME}-${pair##*:}
            chmod +x wifisight-cli-$src/wifisight-cli
            tar -czf out/$dst.tar.gz -C wifisight-cli-$src wifisight-cli
          done
          cp wifisight-cli-windows-latest/wifisight-cli.exe out/wifisight-cli-${GITHUB_REF_NAME}-windows-x86_64.exe
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber --repo "$GITHUB_REPOSITORY"
