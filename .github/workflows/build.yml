name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unit tests + clippy + CLI on all three OSes (this is what type-checks the
  # macOS CoreWLAN and Windows WLAN API backends).
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04-arm = aarch64 CLI for the Raspberry Pi probe (docs/probe.md); 22.04 so the
        # binary needs glibc 2.35 at most (Raspberry Pi OS bookworm has 2.36)
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test core + scanner + cli
        run: cargo test -p wifi-core -p wifi-scan -p wifi-cli
      - name: Clippy (core / scanner / cli)
        run: cargo clippy -p wifi-core -p wifi-scan -p wifi-cli
      - name: Build CLI
        run: cargo build -p wifi-cli --release
      - name: Universal CLI (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build -p wifi-cli --release --target x86_64-apple-darwin
          lipo -create target/release/wifisight-cli target/x86_64-apple-darwin/release/wifisight-cli -output wifisight-cli-universal
          mv wifisight-cli-universal target/release/wifisight-cli
      - uses: actions/upload-artifact@v7
        with:
          name: wifisight-cli-${{ matrix.os }}
          path: |
            target/release/wifisight-cli
            target/release/wifisight-cli.exe

  # UI: type-check + build (dist/ is also what the Tauri backend embeds, so clippy needs it),
  # the node self-checks (src/*.check.ts, npm run check), and clippy on the Tauri backend.
  ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - name: Type-check and build the UI
        run: npm run build
      - name: Self-checks
        run: npm run check
      - name: Clippy (Tauri backend)
        run: cargo clippy -p wifisight -- -D warnings

  # GUI bundles: .dmg (macOS universal), NSIS -setup.exe + portable exe
  # (Windows), .deb (Linux x86_64 / aarch64). On a v* tag the app version is
  # taken from the tag (e.g. 0.1.0-beta.3) so .deb/NSIS upgrades work between
  # betas; MSI is not built because it rejects non-numeric pre-releases.
  bundle:
    needs: [test, ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # app: the updater's .app.tar.gz is only made when the app bundle is a target
            args: "--target universal-apple-darwin --bundles app,dmg"
          - platform: ubuntu-22.04
            args: "--bundles deb"
          - platform: ubuntu-22.04-arm
            args: "--bundles deb"
          - platform: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # regenerate so the bundled notices match Cargo.lock (bundle.resources)
      - run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html
      - run: npm ci
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Config overrides go through a file: JSON on the command line
          # gets its quotes stripped by npm's cmd shim on Windows.
          conf='{}'
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            if grep -q REPLACE_WITH_TAURI_SIGNER_PUBLIC_KEY src-tauri/tauri.conf.json; then
              echo "::error::set plugins.updater.pubkey in tauri.conf.json"; exit 1
            fi
            conf=$(jq -c --arg v "${GITHUB_REF_NAME#v}" '.version = $v' <<<"$conf")
          fi
          # PRs from forks have no secrets: build without updater artifacts
          if [[ -z $TAURI_SIGNING_PRIVATE_KEY ]]; then
            conf=$(jq -c '.bundle.createUpdaterArtifacts = false' <<<"$conf")
          fi
          echo "$conf" > "$RUNNER_TEMP/override.json"
          npm run tauri build -- ${{ matrix.args }} --config "$RUNNER_TEMP/override.json"
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app.tar.gz*
            target/release/bundle/nsis/*-setup.exe*
            target/release/bundle/deb/*.deb*
            target/release/wifisight.exe
            THIRD_PARTY_LICENSES.html

  # On a v* tag, collect the bundles and CLI binaries into a draft release.
  # Tags with a pre-release suffix are marked as pre-release, except
  # -release.N (the stable scheme: plain 0.1.0 would sort below
  # 0.1.0-beta.N in dpkg).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # scripts/probe-deb.sh
      - uses: actions/download-artifact@v8
      - name: Package
        run: |
          mkdir out
          find bundle-* \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.deb' \) -exec cp {} out/ \;
          # the bare app exe runs without installing (needs WebView2)
          cp "$(find bundle-windows-latest -name wifisight.exe)" "out/WiFiSight_${GITHUB_REF_NAME#v}_x64-portable.exe"
          # standalone copy for the bare .exe downloads
          cp bundle-ubuntu-22.04/THIRD_PARTY_LICENSES.html out/
          # in-app updater: macOS updates from the .app.tar.gz, the others from the installers above
          cp "$(find bundle-macos-latest -name '*.app.tar.gz')" "out/WiFiSight_${GITHUB_REF_NAME#v}_universal.app.tar.gz"
          base=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME
          entry() { # $1 = file under bundle-*, $2 = its asset name in out/
            jq -n --arg url "$base/$2" --rawfile sig "$1.sig" '{url: $url, signature: $sig}'
          }
          one() { find bundle-* -name "$1" | head -1; }
          mac=$(entry "$(one '*.app.tar.gz')" "WiFiSight_${GITHUB_REF_NAME#v}_universal.app.tar.gz")
          f=$(one '*-setup.exe'); win=$(entry "$f" "$(basename "$f")")
          f=$(one '*_amd64.deb'); deb64=$(entry "$f" "$(basename "$f")")
          f=$(one '*_arm64.deb'); debarm=$(entry "$f" "$(basename "$f")")
          jq -n --arg v "${GITHUB_REF_NAME#v}" --arg d "$(date -u +%FT%TZ)" \
            --argjson mac "$mac" --argjson win "$win" --argjson deb64 "$deb64" --argjson debarm "$debarm" \
            '{version: $v, pub_date: $d, platforms: {
              "darwin-aarch64": $mac, "darwin-x86_64": $mac, "windows-x86_64": $win,
              "linux-x86_64-deb": $deb64, "linux-aarch64-deb": $debarm}}' > out/latest.json
          for pair in ubuntu-22.04:linux-x86_64 ubuntu-22.04-arm:linux-aarch64 macos-latest:macos-universal; do
            src=${pair%%:*} dst=wifisight-cli-${GITHUB_REF_NAME}-${pair##*:}
            chmod +x wifisight-cli-$src/wifisight-cli
            tar -czf out/$dst.tar.gz -C wifisight-cli-$src wifisight-cli -C "$PWD/out" THIRD_PARTY_LICENSES.html
          done
          # probe .deb (wifisight-cli + systemd unit); built into out/ only, so the updater's *.deb lookups in bundle-* never see it
          for pair in ubuntu-22.04:amd64 ubuntu-22.04-arm:arm64; do
            scripts/probe-deb.sh wifisight-cli-${pair%%:*}/wifisight-cli "${GITHUB_REF_NAME#v}" "${pair##*:}" out
          done
          cp wifisight-cli-windows-latest/wifisight-cli.exe out/wifisight-cli-${GITHUB_REF_NAME}-windows-x86_64.exe
          ls -l out
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=()
          if [[ $GITHUB_REF_NAME == *-* && $GITHUB_REF_NAME != *-release.* ]]; then pre=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" out/* --draft --title "WiFiSight $GITHUB_REF_NAME" "${pre[@]}" --repo "$GITHUB_REPOSITORY"
