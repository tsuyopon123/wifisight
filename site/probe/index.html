<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>WiFiSight Probe</title>
  <!-- Served by `wifisight-cli serve` at /ui and published on the website: everything stays inline. -->
  <style>
    :root {
      --bg: #ffffff;
      --band: #f5f5f7;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: #d2d2d7;
      --accent: #0066cc;
      --btn: #0071e3;
      --bad: #c4314b;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --band: #161617;
        --ink: #f5f5f7;
        --muted: #a1a1a6;
        --line: #424245;
        --accent: #2997ff;
        --bad: #ff6b81;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 0.9375rem/1.4 var(--font);
      -webkit-text-size-adjust: 100%;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--band);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 1.0625rem; font-weight: 600; }
    header .grow { flex: 1; }
    input, select, button {
      font: inherit;
      color: inherit;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      min-height: 2.25rem;
    }
    button { background: var(--btn); color: #fff; border-color: var(--btn); cursor: pointer; }
    #status { color: var(--muted); font-size: 0.8125rem; }
    #status.err, .warn { color: var(--bad); }
    main { padding: 0 1rem 2rem; }
    .warn { margin: 0.75rem 0 0; font-size: 0.8125rem; }
    .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }
    th, td { padding: 0.45rem 0.6rem; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
    th { font-size: 0.75rem; font-weight: 600; color: var(--muted); cursor: pointer; user-select: none; }
    th[aria-sort] { color: var(--ink); }
    th[aria-sort="ascending"]::after { content: " ▲"; }
    th[aria-sort="descending"]::after { content: " ▼"; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.mono { font-family: var(--mono); font-size: 0.8125rem; }
    td.dim { color: var(--muted); }
    tr.connected td:first-child { box-shadow: inset 3px 0 var(--accent); font-weight: 600; }
    form#go { max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    form#go label { display: block; margin-bottom: 0.5rem; }
    form#go div { display: flex; gap: 0.5rem; }
    form#go input { flex: 1; }
    form#go p { color: var(--muted); font-size: 0.8125rem; }
  </style>
</head>
<body>
  <!-- On the HTTPS website a browser can't fetch an http:// probe, so it hands over to the probe's own page. -->
  <form id="go" hidden>
    <h1>WiFiSight Probe</h1>
    <label for="addr">Probe address</label>
    <div>
      <input id="addr" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="wifiprobe.local:8737" />
      <button>Open</button>
    </div>
    <p>Opens http://&lt;address&gt;/ui, the page served by <code>wifisight-cli serve</code> on the probe.</p>
  </form>

  <div id="app" hidden>
    <header>
      <h1>WiFiSight Probe</h1>
      <select id="iface" aria-label="Interface"></select>
      <input id="filter" type="search" placeholder="Filter SSID / AP" aria-label="Filter" />
      <span class="grow"></span>
      <span id="status" role="status">Scanning…</span>
    </header>
    <main>
      <div id="warnings"></div>
      <div class="scroll">
        <table>
          <thead><tr id="head"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const KEY = "wifisight.probe";

    if (location.protocol === "https:") {
      let saved = "";
      try { saved = localStorage.getItem(KEY) || ""; } catch {}
      $("addr").value = saved || "wifiprobe.local:8737";
      $("go").hidden = false;
      $("go").onsubmit = (e) => {
        e.preventDefault();
        const addr = $("addr").value.trim().replace(/^https?:\/\//, "").replace(/\/.*$/, "");
        if (!addr) return;
        try { localStorage.setItem(KEY, addr); } catch {}
        location.href = "http://" + addr + "/ui";
      };
    } else {
      $("app").hidden = false;
      run();
    }

    function run() {
      // [label, value for sorting/display, css class]
      const COLS = [
        ["SSID", (b) => (b.hidden ? "(hidden)" : b.ssid), ""],
        ["AP", (b) => b.apName || "", ""],
        ["Vendor", (b) => b.vendor || "", "dim"],
        ["BSSID", (b) => b.bssid, "mono"],
        ["Band", (b) => b.band, "num"],
        ["Ch", (b) => b.channel, "num"],
        ["Width", (b) => b.widthMhz, "num"],
        ["RSSI", (b) => b.rssiDbm, "num"],
        ["Util %", (b) => (b.bssLoad ? Math.round(b.bssLoad.channelUtilizationPct) : null), "num"],
        ["Generation", (b) => b.generation, ""],
        ["Security", (b) => b.security.label, ""],
      ];
      let sort = { col: 7, dir: -1 };
      let bss = [];

      const head = $("head");
      COLS.forEach(([label], i) => {
        const th = document.createElement("th");
        th.textContent = label;
        th.onclick = () => {
          sort = sort.col === i ? { col: i, dir: -sort.dir } : { col: i, dir: i === 7 || i === 8 ? -1 : 1 };
          render();
        };
        head.append(th);
      });
      $("filter").oninput = render;

      // Every value from the probe (SSID, AP name, warnings…) is attacker-controlled: textContent only.
      function render() {
        [...head.children].forEach((th, i) =>
          i === sort.col ? th.setAttribute("aria-sort", sort.dir > 0 ? "ascending" : "descending") : th.removeAttribute("aria-sort"));
        const q = $("filter").value.trim().toLowerCase();
        const val = COLS[sort.col][1];
        const list = bss
          .filter((b) => !q || (b.ssid + " " + (b.apName || "")).toLowerCase().includes(q))
          .sort((a, b) => {
            const x = val(a), y = val(b);
            if (x === y) return b.rssiDbm - a.rssiDbm;
            if (x === null || x === "") return 1;
            if (y === null || y === "") return -1;
            return (x < y ? -1 : 1) * sort.dir;
          });
        $("rows").replaceChildren(...list.map((b) => {
          const tr = document.createElement("tr");
          if (b.connected) tr.className = "connected";
          for (const [, v, cls] of COLS) {
            const td = document.createElement("td");
            const x = v(b);
            td.textContent = x === null ? "" : String(x);
            if (cls) td.className = cls;
            tr.append(td);
          }
          return tr;
        }));
      }

      function status(text, err) {
        $("status").textContent = text;
        $("status").className = err ? "err" : "";
      }

      async function text(res) {
        const t = await res.text();
        if (!res.ok) throw new Error(t || res.status + " " + res.statusText);
        return t;
      }

      async function loadInterfaces() {
        const sel = $("iface");
        try {
          const list = JSON.parse(await text(await fetch("/interfaces")));
          // "" = the probe's own default (serve --iface), like the GUI
          const opt = (value, label) => {
            const o = document.createElement("option");
            o.value = value;
            o.textContent = label;
            return o;
          };
          sel.replaceChildren(opt("", "Default"), ...list.map((i) => opt(i.id, i.name || i.id)));
          sel.hidden = list.length < 2;
        } catch {
          sel.hidden = true;
        }
        sel.onchange = () => { bss = []; render(); status("Scanning…"); };
      }

      async function loop() {
        for (;;) {
          const iface = $("iface").value;
          try {
            const o = JSON.parse(await text(await fetch("/bss" + (iface ? "?iface=" + encodeURIComponent(iface) : ""))));
            if (iface !== $("iface").value) continue; // switched while scanning
            bss = o.bss;
            $("warnings").replaceChildren(...o.warnings.map((w) => {
              const p = document.createElement("p");
              p.className = "warn";
              p.textContent = w;
              return p;
            }));
            render();
            // browser clock: a probe without RTC/NTP can be far off
            status(o.interface + " · " + bss.length + " BSS · " + new Date().toLocaleTimeString());
          } catch (e) {
            status(e instanceof TypeError ? "Probe unreachable" : e.message, true);
            await new Promise((r) => setTimeout(r, 3000));
          }
        }
      }

      render();
      loadInterfaces().then(loop);
    }
  </script>
</body>
</html>
